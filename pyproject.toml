[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "DFS maze generator with BFS pathfinding"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["srcs*"]

[project.scripts]
a-maze-ing = "a_maze_ing:main"   # assumes a main() function in a_maze_ing.py